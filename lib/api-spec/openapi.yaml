openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: music
    description: Discord music bot status and help
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /music/status:
    get:
      operationId: getMusicBotStatus
      tags: [music]
      summary: Get Discord music bot status
      description: Returns the live connection state of the Discord music bot.
      responses:
        "200":
          description: Bot status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MusicBotStatus"
  /music/commands:
    get:
      operationId: getMusicCommands
      tags: [music]
      summary: List available music commands
      description: Returns the slash commands supported by the Discord bot.
      responses:
        "200":
          description: Available commands
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MusicCommand"
  /music/activity:
    get:
      operationId: getMusicActivity
      tags: [music]
      summary: Get recent bot activity
      description: Returns a short in-memory feed of recent bot connection and playback events.
      responses:
        "200":
          description: Recent activity
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MusicActivity"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    MusicBotStatus:
      type: object
      properties:
        state:
          type: string
          enum: [online, offline, starting, misconfigured]
        botName:
          type: ["string", "null"]
        botId:
          type: ["string", "null"]
        guildCount:
          type: integer
          minimum: 0
        latencyMs:
          type: ["integer", "null"]
          minimum: 0
        detail:
          type: string
      required: [state, botName, botId, guildCount, latencyMs, detail]
    MusicCommand:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        usage:
          type: string
      required: [name, description, usage]
    MusicActivity:
      type: object
      properties:
        id:
          type: string
        message:
          type: string
        createdAt:
          type: string
          format: date-time
        kind:
          type: string
          enum: [system, playback, warning]
      required: [id, message, createdAt, kind]

